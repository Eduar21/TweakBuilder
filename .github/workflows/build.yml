name: Build Tweak
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Theos
        uses: Randomblock1/theos-action@v1
      - name: Build
        run: make package FINALPACKAGE=1
      - name: Strip signature
        run: |
          ldid -S .theos/obj/arm64/Iayt.dylib
          codesign --remove-signature .theos/obj/arm64/Iayt.dylib || true
      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: Iayt-deb
          path: packages/*.deb
          retention-days: 7
      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: Iayt-dylib
          path: .theos/obj/arm64/Iayt.dylib
          retention-days: 7
